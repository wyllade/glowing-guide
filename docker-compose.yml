services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: counselling
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      FLASK_APP: run.py
      FLASK_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@db:5432/counselling
      SECRET_KEY: docker-secret-key-change-me
      JWT_SECRET_KEY: docker-jwt-secret-change-me
    depends_on:
      - db
    volumes:
      - ./backend:/app

volumes:
  pgdata:
